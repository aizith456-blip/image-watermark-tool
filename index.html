<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水印编辑器 v22.0 (一键应用到全部)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; margin: 0; height: 100vh; overflow: hidden; background-color: #f0f2f5; }
        .layout { display: flex; height: 100%; width: 100%; }

        /* 左侧：图片列表 */
        .left-sidebar { width: 110px; flex-shrink: 0; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 20; }
        .thumb-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .thumb-header { padding: 10px; text-align: center; font-size: 12px; color: #888; border-bottom: 1px solid #eee; background: #f9f9f9; }

        /* 中间：画布区域 */
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #e0e0e0; background-image: radial-gradient(#aaa 1px, transparent 1px); background-size: 20px 20px; position: relative; overflow: hidden; padding: 20px; }
        .canvas-box { box-shadow: 0 8px 30px rgba(0,0,0,0.25); background: white; transition: all 0.2s; }

        /* 右侧：功能区 */
        .right-sidebar { width: 300px; flex-shrink: 0; background: white; border-left: 1px solid #ddd; display: flex; flex-direction: column; padding: 20px; z-index: 20; overflow-y: auto; }

        /* 组件样式 */
        .thumb-item { position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; cursor: pointer; background: #eee; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        .thumb-item.active { border-color: #007bff; box-shadow: 0 0 0 2px rgba(0,123,255,0.2); }
        .btn-delete { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; background: #ff4d4f; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
        .thumb-item:hover .btn-delete { opacity: 1; }

        h2 { margin: 0 0 20px 0; font-size: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; color: #333; }
        .panel { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed #eee; }
        .btn { width: 100%; padding: 12px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover:not(:disabled) { background: #f8f9fa; transform: translateY(-1px); }
        .btn-primary { background: #007bff; color: white; border: none; }
        .btn-primary:hover:not(:disabled) { background: #0069d9; }
        
        /* 应用到全部按钮特别样式 */
        .btn-apply-all { background: #6610f2; color: white; border: none; font-weight: bold; margin-top: 15px; }
        .btn-apply-all:hover:not(:disabled) { background: #520dc2; }

        .hd-switch { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: #555; background: #f9f9f9; padding: 10px; border-radius: 6px; }
        .hd-tag { background: #ff2442; color: white; padding: 1px 4px; border-radius: 3px; font-size: 10px; margin-left: auto;}

        /* 悬浮工具栏 */
        .floating-tools { position: absolute; display: none; background: white; padding: 6px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 100; border: 1px solid #eee; }
        .tool-row { display: flex; gap: 5px; align-items: center; }
        .icon-btn { width: 30px; height: 30px; border: none; background: transparent; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .icon-btn:hover { background: #eee; }
        .icon-btn.active { background: #e3f2fd; color: #007bff; }
        .color-wrap { width: 25px; height: 25px; position: relative; border: 1px solid #ddd; border-radius: 3px; overflow: hidden; }
        .color-wrap input { position: absolute; top:-5px; left:-5px; width: 40px; height: 40px; cursor: pointer; }
        .text-tools-only { display: flex; gap: 5px; align-items: center; }
    </style>
</head>
<body>

<div class="layout">
    <div class="left-sidebar">
        <div class="thumb-header" id="count-label">0 张图片</div>
        <div class="thumb-list" id="thumb-list"></div>
        <div style="padding:10px;">
            <button class="btn" style="font-size:12px; margin:0;" onclick="document.getElementById('file-input').click()">+ 加图</button>
        </div>
    </div>

    <div class="workspace" id="workspace">
        <div class="canvas-box">
            <canvas id="c"></canvas>
        </div>
        <div id="float-bar" class="floating-tools">
            <div class="tool-row">
                <div id="text-tools" class="text-tools-only">
                    <select id="tool-font" style="font-size:12px; width:80px;">
                        <option value="'Noto Sans SC', sans-serif">黑体</option>
                        <option value="'Noto Serif SC', serif">宋体</option>
                        <option value="'ZCOOL KuaiLe', cursive">快乐体</option>
                        <option value="Arial">Arial</option>
                    </select>
                    <button class="icon-btn" id="tool-bold">B</button>
                    <div class="color-wrap" title="字色"><input type="color" id="tool-color"></div>
                    <div class="color-wrap" title="底色"><input type="color" id="tool-bg-color"></div>
                    <button class="icon-btn" id="tool-bg-clear" style="font-size:12px">🚫</button>
                    <div style="width:1px; height:20px; background:#ddd; margin:0 2px;"></div>
                </div>
                <button class="icon-btn" id="tool-del" style="color:red">×</button>
            </div>
        </div>
    </div>

    <div class="right-sidebar">
        <h2>水印编辑器 Pro</h2>
        <input type="file" id="file-input" accept="image/*" multiple style="display:none">
        
        <div class="panel">
            <div style="font-weight:bold; margin-bottom:8px; font-size:13px; color:#555;">画布设置</div>
            <div style="display:flex; gap:8px;">
                <select id="fill-mode" style="flex:1; padding:10px; border-radius:6px; border:1px solid #ddd;">
                    <option value="smart">🎨 智能吸色</option>
                    <option value="#ffffff" selected>⬜ 白色</option>
                    <option value="#000000">⬛ 黑色</option>
                </select>
                <button class="btn" id="btn-34" style="flex:1; margin:0;">📐 3:4</button>
            </div>
            <label class="hd-switch">
                <input type="checkbox" id="hd-toggle" checked>
                <span>1080P 高清增强</span>
                <span class="hd-tag">HD</span>
            </label>
        </div>
        
        <div class="panel">
            <div style="font-weight:bold; margin-bottom:8px; font-size:13px; color:#555;">内容添加</div>
            <button class="btn" id="btn-text">🅰️ 添加文本</button>
            <input type="file" id="wm-img-input" accept="image/*" style="display:none">
            <button class="btn" id="btn-wm-img">🖼️ 添加图片水印</button>

            <!-- 🆕 新增：应用到全部按钮 -->
            <button class="btn btn-apply-all" id="btn-apply-all">⚡ 将当前效果应用到全部</button>
        </div>
        
        <div style="margin-top:auto;">
            <button class="btn btn-primary" id="btn-process" disabled>🚀 导出全部图片</button>
            <div id="download-area" style="text-align:center; margin-top:10px; font-size:13px;"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const canvas = new fabric.Canvas('c', { backgroundColor: '#fff', preserveObjectStacking: true });
    
    // DOM 引用
    const fileInput = document.getElementById('file-input');
    const thumbList = document.getElementById('thumb-list');
    const countLabel = document.getElementById('count-label');
    const workspace = document.getElementById('workspace');
    const btn34 = document.getElementById('btn-34');
    const fillSelect = document.getElementById('fill-mode');
    const hdToggle = document.getElementById('hd-toggle');
    const btnText = document.getElementById('btn-text');
    const btnProcess = document.getElementById('btn-process');
    const wmImgInput = document.getElementById('wm-img-input');
    const btnWmImg = document.getElementById('btn-wm-img');
    const btnApplyAll = document.getElementById('btn-apply-all'); // 新按钮
    
    let allFiles = []; 
    let imageConfigs = {}; 
    let currentIndex = -1; 
    let currentRawImg = null; 
    let currentIs34 = false; 

    // 自适应画布
    function fitCanvasToScreen() {
        if (!currentRawImg) return;
        let w = currentRawImg.width, h = currentRawImg.height;
        if (currentIs34) {
            if (w/h > 0.75) h = w / 0.75; else w = h * 0.75;
        }
        const boxW = workspace.clientWidth - 40;
        const boxH = workspace.clientHeight - 40;
        const scale = Math.min(boxW / w, boxH / h, 1);
        canvas.setWidth(w * scale);
        canvas.setHeight(h * scale);
        canvas.setZoom(scale);
        renderBackground(w, h);
    }
    window.addEventListener('resize', fitCanvasToScreen);

    // 保存状态
    function saveCurrentState() {
        if (currentIndex === -1) return;
        const json = canvas.toJSON(['id', 'selectable', 'name', 'backgroundColor']);
        delete json.backgroundImage; 
        imageConfigs[currentIndex] = {
            fabricJSON: json,
            is34: currentIs34,
            fillMode: fillSelect.value
        };
    }

    // 加载图片
    function loadImage(index) {
        if (currentIndex !== -1) saveCurrentState();
        const file = allFiles[index];
        if (!file) return;

        currentIndex = index;
        updateThumbUI();

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                currentRawImg = img;
                if (imageConfigs[index]) {
                    const conf = imageConfigs[index];
                    currentIs34 = conf.is34;
                    fillSelect.value = conf.fillMode;
                    canvas.clear();
                    if(conf.fabricJSON && conf.fabricJSON.objects) {
                        canvas.loadFromJSON(conf.fabricJSON, canvas.renderAll.bind(canvas));
                    }
                }
                updateUIState();
                fitCanvasToScreen();
            };
        };
        reader.readAsDataURL(file);
    }

    function renderBackground(targetW, targetH) {
        if (!currentRawImg) return;
        let bgColor = '#fff';
        if (currentIs34) {
            const mode = fillSelect.value;
            bgColor = (mode === 'smart') ? getSmartColor(currentRawImg) : mode;
        }
        canvas.backgroundColor = bgColor; 
        const imgInstance = new fabric.Image(currentRawImg, {
            originX: 'center', originY: 'center',
            left: targetW / 2, top: targetH / 2
        });
        canvas.setBackgroundImage(imgInstance, canvas.requestRenderAll.bind(canvas));
    }

    function updateUIState() {
        if (currentIs34) {
            btn34.textContent = "✅ 3:4 (已开)";
            btn34.style.background = "#e6fffa";
            btn34.style.borderColor = "#00bfa5";
        } else {
            btn34.textContent = "📐 3:4";
            btn34.style.background = "#fff";
            btn34.style.borderColor = "#ddd";
        }
    }

    function renderThumbList() {
        thumbList.innerHTML = '';
        countLabel.textContent = `${allFiles.length} 张图片`;
        if (allFiles.length === 0) { btnProcess.disabled = true; return; }
        btnProcess.disabled = false;
        allFiles.forEach((file, idx) => {
            const div = document.createElement('div');
            div.className = `thumb-item ${idx === currentIndex ? 'active' : ''}`;
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            const del = document.createElement('div');
            del.className = 'btn-delete';
            del.textContent = '×';
            del.onclick = (e) => { e.stopPropagation(); deleteImage(idx); };
            div.onclick = () => loadImage(idx);
            div.appendChild(img); div.appendChild(del); thumbList.appendChild(div);
        });
    }

    function updateThumbUI() {
        const items = thumbList.querySelectorAll('.thumb-item');
        items.forEach((item, idx) => {
            if (idx === currentIndex) item.classList.add('active'); else item.classList.remove('active');
        });
    }

    function deleteImage(index) {
        allFiles.splice(index, 1);
        let newConfigs = {};
        Object.keys(imageConfigs).forEach(k => {
            let oldIdx = parseInt(k);
            if (oldIdx < index) newConfigs[oldIdx] = imageConfigs[oldIdx];
            if (oldIdx > index) newConfigs[oldIdx - 1] = imageConfigs[oldIdx];
        });
        imageConfigs = newConfigs;
        if (allFiles.length === 0) { currentIndex = -1; currentRawImg = null; canvas.clear(); }
        else { if (index === currentIndex) loadImage(Math.max(0, index - 1)); else if (index < currentIndex) currentIndex--; }
        renderThumbList();
    }

    fileInput.onchange = (e) => {
        if (!e.target.files.length) return;
        allFiles = allFiles.concat(Array.from(e.target.files));
        renderThumbList();
        if (currentIndex === -1) loadImage(0);
        fileInput.value = '';
    };

    btn34.onclick = () => {
        if (!currentRawImg) return;
        currentIs34 = !currentIs34; 
        updateUIState(); fitCanvasToScreen(); 
    };

    // 添加文本
    btnText.onclick = () => {
        const t = new fabric.IText('输入文字', {
            left: canvas.width / 2 / canvas.getZoom(),
            top: canvas.height / 2 / canvas.getZoom(),
            originX:'center', originY:'center',
            fontFamily: "'Noto Sans SC', sans-serif", fontSize: 40, fill: '#fff',
            cornerColor: '#007bff', cornerStyle:'circle',
            shadow: 'rgba(0,0,0,0.5) 2px 2px 4px'
        });
        canvas.add(t); canvas.setActiveObject(t);
    };

    // 图片水印
    btnWmImg.onclick = () => wmImgInput.click();
    wmImgInput.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (f) => {
            fabric.Image.fromURL(f.target.result, (img) => {
                const canvasW = canvas.width / canvas.getZoom();
                const scale = (canvasW * 0.3) / img.width;
                img.set({
                    left: canvasW / 2, top: canvas.height / 2 / canvas.getZoom(),
                    originX: 'center', originY: 'center',
                    scaleX: scale, scaleY: scale,
                    cornerColor: '#007bff', cornerStyle: 'circle'
                });
                canvas.add(img); canvas.setActiveObject(img);
                wmImgInput.value = ''; 
            });
        };
        reader.readAsDataURL(file);
    };

    // 🆕 核心功能：应用到全部
    btnApplyAll.onclick = () => {
        if (currentIndex === -1) return;
        
        // 1. 保存当前状态
        saveCurrentState();
        
        // 2. 获取当前配置模板
        const template = imageConfigs[currentIndex];
        if (!template) return;
        
        // 3. 询问确认（可选，这里直接执行体验更好）
        
        // 4. 覆盖所有图片的配置
        for (let i = 0; i < allFiles.length; i++) {
            // 深拷贝配置，确保后续独立编辑互不影响
            // JSON序列化是最简单的深拷贝方式
            imageConfigs[i] = {
                fabricJSON: JSON.parse(JSON.stringify(template.fabricJSON)),
                is34: template.is34,
                fillMode: template.fillMode
            };
        }
        
        // 5. 视觉反馈
        const originalText = btnApplyAll.textContent;
        btnApplyAll.textContent = "✅ 已应用到所有图片！";
        btnApplyAll.disabled = true;
        setTimeout(() => {
            btnApplyAll.textContent = originalText;
            btnApplyAll.disabled = false;
        }, 1500);
    };

    function getSmartColor(img) {
        const c = document.createElement('canvas'); c.width=30; c.height=30;
        const x = c.getContext('2d'); x.drawImage(img,0,0,30,30);
        const d = x.getImageData(0,0,30,30).data;
        let r=0,g=0,b=0,n=0;
        const p=[0,29,870,899]; 
        p.forEach(i=>{ if(d[i*4+3]>0){r+=d[i*4];g+=d[i*4+1];b+=d[i*4+2];n++} });
        return n?`rgb(${~~(r/n)},${~~(g/n)},${~~(b/n)})`:'#fff';
    }

    // 导出逻辑
    btnProcess.onclick = async () => {
        saveCurrentState();
        canvas.discardActiveObject().renderAll();
        btnProcess.disabled = true;
        const dlArea = document.getElementById('download-area');
        dlArea.innerHTML = '⏳ 正在处理...';
        
        const zip = new JSZip();
        const isHD = hdToggle.checked;
        
        const templateConfig = {
            fabricJSON: canvas.toJSON(['id', 'backgroundColor']),
            is34: currentIs34,
            fillMode: fillSelect.value
        };
        delete templateConfig.fabricJSON.backgroundImage;

        for (let i = 0; i < allFiles.length; i++) {
            const file = allFiles[i];
            dlArea.innerHTML = `处理中 (${i+1}/${allFiles.length})`;
            const conf = imageConfigs[i] || templateConfig;
            
            try {
                const blob = await processOne(file, conf, isHD);
                zip.file(`xhs_${file.name.replace(/\.[^/.]+$/, "")}.jpg`, blob);
            } catch(e) { console.error(e); }
        }
        
        dlArea.innerHTML = '📦 正在打包...';
        const content = await zip.generateAsync({type:"blob"});
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url; a.download = "images.zip"; a.innerText = "点击下载 ZIP";
        dlArea.innerHTML = ''; dlArea.appendChild(a); a.click();
        btnProcess.disabled = false;
    };

    function processOne(file, config, isHD) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height;
                    let scale = 1;
                    if(isHD && w < 1080) { scale = 1080/w; w=1080; h=Math.round(h*scale); }
                    
                    let fw = w, fh = h;
                    if(config.is34) { if(fw/fh > 0.75) fh = fw / 0.75; else fw = fh * 0.75; }
                    
                    const vc = new fabric.StaticCanvas(null, {width:fw, height:fh});
                    
                    let bgC = '#fff';
                    if(config.is34) {
                        bgC = (config.fillMode === 'smart') ? getSmartColor(img) : config.fillMode;
                    }
                    vc.backgroundColor = bgC;
                    
                    const bgImg = new fabric.Image(img, {
                        originX:'center', originY:'center',
                        left:fw/2, top:fh/2,
                        scaleX: scale, scaleY: scale
                    });
                    vc.add(bgImg);
                    
                    if (config.fabricJSON && config.fabricJSON.objects.length > 0) {
                        const hdScale = isHD ? scale : 1;
                        fabric.util.enlivenObjects(config.fabricJSON.objects, (objs) => {
                            objs.forEach(o => {
                                o.set({
                                    left: o.left * hdScale,
                                    top: o.top * hdScale,
                                    scaleX: o.scaleX * hdScale,
                                    scaleY: o.scaleY * hdScale
                                });
                                vc.add(o);
                            });
                            vc.renderAll();
                            const d = vc.toDataURL({format:'jpeg', quality:1});
                            fetch(d).then(r=>r.blob()).then(resolve);
                        });
                    } else {
                        vc.renderAll();
                        const d = vc.toDataURL({format:'jpeg', quality:1});
                        fetch(d).then(r=>r.blob()).then(resolve);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    const floatBar = document.getElementById('float-bar');
    const textTools = document.getElementById('text-tools');
    function updateFloatBar() {
        const o = canvas.getActiveObject();
        if (o) {
            floatBar.style.display = 'block';
            if (o.type === 'i-text') {
                textTools.style.display = 'flex';
                document.getElementById('tool-color').value = o.fill;
                document.getElementById('tool-font').value = o.fontFamily;
                if(o.backgroundColor) document.getElementById('tool-bg-color').value = o.backgroundColor;
            } else {
                textTools.style.display = 'none';
            }
            const b = o.getBoundingRect();
            const barW = floatBar.offsetWidth || 200;
            let left = b.left + b.width/2 - barW/2;
            let top = b.top - 50;
            if(top<0) top = b.top + b.height + 10;
            floatBar.style.left = left + 'px';
            floatBar.style.top = top + 'px';
        } else { floatBar.style.display = 'none'; }
    }
    canvas.on('selection:created', updateFloatBar);
    canvas.on('selection:updated', updateFloatBar);
    canvas.on('selection:cleared', () => floatBar.style.display='none');
    canvas.on('object:moving', updateFloatBar);
    
    document.getElementById('tool-bold').onclick = () => { const o=canvas.getActiveObject(); if(o && o.type==='i-text'){o.set('fontWeight',o.fontWeight==='bold'?'normal':'bold');canvas.renderAll();} };
    document.getElementById('tool-del').onclick = () => { const o=canvas.getActiveObjects(); if(o.length){canvas.discardActiveObject();canvas.remove(...o);canvas.renderAll();} };
    document.getElementById('tool-color').oninput = (e) => { const o=canvas.getActiveObject(); if(o && o.type==='i-text'){o.set('fill',e.target.value);canvas.renderAll();} };
    document.getElementById('tool-font').onchange = (e) => { const o=canvas.getActiveObject(); if(o && o.type==='i-text'){o.set('fontFamily',e.target.value);canvas.renderAll();} };
    document.getElementById('tool-bg-color').oninput = (e) => { const o=canvas.getActiveObject(); if(o && o.type==='i-text'){o.set('backgroundColor',e.target.value);canvas.renderAll();} };
    document.getElementById('tool-bg-clear').onclick = () => { const o=canvas.getActiveObject(); if(o && o.type==='i-text'){o.set('backgroundColor','');canvas.renderAll();} };
});
</script>
</body>
</html>
