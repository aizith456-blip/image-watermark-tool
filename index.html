<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水印编辑器 v11.0 (智能边缘填充)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ...大部分CSS无变化... */
        body { font-family: 'Noto Sans SC', sans-serif; margin: 0; height: 100vh; overflow: hidden; background-color: #f0f2f5; }
        .editor-container { display: flex; height: 100%; }
        .workspace { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; position: relative; overflow: auto; }
        .canvas-container { box-shadow: 0 8px 16px rgba(0,0,0,0.15); background-color: white; }
        .sidebar { width: 280px; flex-shrink: 0; background-color: #fff; box-shadow: -2px 0 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding: 1.5rem; }
        h2 { font-size: 1.2rem; margin-top: 0; padding-bottom: 0.8rem; border-bottom: 1px solid #eee; }
        .sidebar-button { /* ... */ }
        .sidebar-button:disabled { /* ... */ }
        
        /* 新增：3:4调整区域的样式 */
        .resize-control-group { display: flex; margin-bottom: 1rem; gap: 8px; }
        #resize-3-4-btn { flex-grow: 1; margin-bottom: 0; }
        #fill-mode-select { padding: 12px 8px; font-size: 1rem; border: 1px solid #ddd; border-radius: 8px; background-color: #f8f9fa; }

        /* 其他样式 */
        .sidebar-footer { margin-top: auto; }
        .process-button { /* ... */ }
        #bg-image-input { display: none; }
        .floating-toolbar { /* ... */ }
    </style>
</head>
<body>
    <div class="editor-container">
        <main class="workspace" id="workspace">
            <canvas id="c"></canvas>
            <!-- 浮动工具栏移到main内部，避免被sidebar遮挡 -->
            <div id="floating-toolbar" class="floating-toolbar" style="display:none; position: absolute; z-index: 1000;">
                 <!-- 工具栏内容将在JS中动态填充 -->
            </div>
        </main>
        <aside class="sidebar">
            <h2>批量加水印</h2>
            <input type="file" id="bg-image-input" accept="image/*" multiple>
            <button class="sidebar-button" id="add-image-btn"><span class="icon">🖼️</span> 添加图片</button>
            
            <!-- 更新：将3:4按钮和填充模式选择组合在一起 -->
            <div class="resize-control-group">
                <select id="fill-mode-select" disabled>
                    <option value="smart">智能边缘</option>
                    <option value="white">白色</option>
                    <option value="black">黑色</option>
                </select>
                <button class="sidebar-button" id="resize-3-4-btn" disabled><span class="icon">📏</span> 调整为 3:4</button>
            </div>

            <button class="sidebar-button" id="add-text-btn"><span class="icon">A</span> 添加文本</button>
            
            <div class="sidebar-footer">
                <button class="process-button" id="process-btn" disabled>
                    <span class="default-text">给多个图片加水印</span>
                    <span class="processing-text">处理中... (0/0)</span>
                </button>
                <div id="download-area" style="margin-top: 1rem; font-size: 0.9rem; text-align: center;"></div>
            </div>
        </aside>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // ... 常量和元素获取 ...
        const canvas = new fabric.Canvas('c', { width: 500, height: 400, backgroundColor: '#eee' });
        const addImageBtn = document.getElementById('add-image-btn');
        const bgImageInput = document.getElementById('bg-image-input');
        const resize34Btn = document.getElementById('resize-3-4-btn');
        const fillModeSelect = document.getElementById('fill-mode-select'); // 新增
        const addTextBtn = document.getElementById('add-text-btn');
        const processBtn = document.getElementById('process-btn');
        
        let originalImageFiles = [];
        let previewScaleFactor = 1;
        let is3to4Mode = false;
        let currentBgImageObject = null; // 存储当前预览的fabric.Image对象

        // --- 图片加载 ---
        addImageBtn.onclick = () => bgImageInput.click();
        bgImageInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                originalImageFiles = Array.from(e.target.files);
                // ...
                const file = originalImageFiles[0]; 
                const reader = new FileReader();
                reader.onload = (f) => {
                    fabric.Image.fromURL(f.target.result, (img) => {
                        currentBgImageObject = img; // 保存图像对象
                        // ... 重置画布和状态 ...
                        canvas.clear();
                        is3to4Mode = false;
                        // ... 计算预览尺寸 ...
                        const previewWidth = img.width * previewScaleFactor;
                        const previewHeight = img.height * previewScaleFactor;
                        // ... 设置背景和启用按钮 ...
                        canvas.setWidth(previewWidth);
                        canvas.setHeight(previewHeight);
                        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), { scaleX: previewScaleFactor, scaleY: previewScaleFactor });
                        resize34Btn.disabled = false;
                        fillModeSelect.disabled = false; // 启用填充模式选择
                    });
                };
                reader.readAsDataURL(file);
            }
        };

        // --- 智能边缘颜色算法 ---
        function getEdgeColor(imgObject, callback) {
            if (!imgObject) {
                callback('#FFFFFF'); // 默认返回白色
                return;
            }
            // 创建一个临时的小canvas来分析颜色，提高性能
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            const imgWidth = imgObject.width;
            const imgHeight = imgObject.height;
            tempCanvas.width = imgWidth;
            tempCanvas.height = imgHeight;
            
            // 将fabric图像对象绘制到临时canvas上
            imgObject.clone(clonedImg => {
                clonedImg.set({ left: 0, top: 0, angle: 0 }); // 重置位置
                const virtualCanvas = new fabric.StaticCanvas(tempCanvas);
                virtualCanvas.add(clonedImg);
                virtualCanvas.renderAll();

                const imageData = tempCtx.getImageData(0, 0, imgWidth, imgHeight).data;
                let r = 0, g = 0, b = 0, count = 0;
                const sampleRate = 5; // 每隔5个像素采样一次，提高性能

                // 采样上下边缘
                for (let x = 0; x < imgWidth; x += sampleRate) {
                    // 上边缘
                    let i = (0 * imgWidth + x) * 4;
                    r += imageData[i]; g += imageData[i+1]; b += imageData[i+2];
                    // 下边缘
                    i = ((imgHeight - 1) * imgWidth + x) * 4;
                    r += imageData[i]; g += imageData[i+1]; b += imageData[i+2];
                    count += 2;
                }
                // 采样左右边缘
                for (let y = 0; y < imgHeight; y += sampleRate) {
                    // 左边缘
                    let i = (y * imgWidth + 0) * 4;
                    r += imageData[i]; g += imageData[i+1]; b += imageData[i+2];
                    // 右边缘
                    i = (y * imgWidth + (imgWidth - 1)) * 4;
                    r += imageData[i]; g += imageData[i+1]; b += imageData[i+2];
                    count += 2;
                }

                r = ~~(r / count);
                g = ~~(g / count);
                b = ~~(b / count);

                callback(`rgb(${r},${g},${b})`);
            });
        }


        // --- 3:4 比例调整 (已更新) ---
        resize34Btn.onclick = () => {
            if (!canvas.backgroundImage) return;
            is3to4Mode = true;
            
            const fillMode = fillModeSelect.value;
            
            const applyFill = (fillColor) => {
                const targetRatio = 3 / 4;
                const bgImg = canvas.backgroundImage;
                const previewWidth = bgImg.width * previewScaleFactor;
                const previewHeight = bgImg.height * previewScaleFactor;
                // ... 计算新画布尺寸 ...
                let newCanvasWidth, newCanvasHeight;
                // ...
                canvas.setWidth(newCanvasWidth);
                canvas.setHeight(newCanvasHeight);
                canvas.backgroundColor = fillColor; // 使用传入的颜色
                
                bgImg.set({ /* ...居中... */ });
                canvas.renderAll();
                resize34Btn.disabled = true;
                fillModeSelect.disabled = true;
            };

            if (fillMode === 'smart') {
                getEdgeColor(currentBgImageObject, (color) => {
                    applyFill(color);
                });
            } else {
                applyFill(fillMode); // 'white' or 'black'
            }
        };

        // --- 批量处理与下载 (已更新) ---
        // processBtn.onclick = ...
        // 单张图片处理函数 (已更新)
        function processImage(file, watermarkObjects, scale, apply3to4) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (f) => {
                    fabric.Image.fromURL(f.target.result, (img) => {

                        const processWithFillColor = (fillColor) => {
                            let canvasWidth = img.width;
                            let canvasHeight = img.height;
                            let finalFillColor = null;

                            if (apply3to4) {
                                // ... 计算3:4画布尺寸 ...
                                finalFillColor = fillColor; // 'white', 'black', or the smart color
                            }

                            const virtualCanvas = new fabric.StaticCanvas(null, {
                                width: canvasWidth, height: canvasHeight, backgroundColor: finalFillColor
                            });

                            // ... 后续添加图片、克隆水印、导出图片的逻辑完全不变 ...
                            // ...
                            resolve(virtualCanvas.toDataURL({ format: 'png', quality: 0.92 }));
                        };

                        if (apply3to4) {
                            const fillMode = fillModeSelect.value;
                            if (fillMode === 'smart') {
                                getEdgeColor(img, (color) => {
                                    processWithFillColor(color);
                                });
                            } else {
                                processWithFillColor(fillMode);
                            }
                        } else {
                            processWithFillColor(null); // 不应用3:4，则不填充颜色
                        }
                    });
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // --- 其他UI和工具栏逻辑 ---
        // (此部分代码与上一版相同，为节省篇幅已省略，请直接复用上一版的完整代码)
        // addTextBtn.onclick = ...
        // processBtn.onclick = ...
        // 浮动工具栏相关的所有代码...
    });
    </script>
</body>
</html>
