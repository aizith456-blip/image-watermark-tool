<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水印编辑器 v13.0 (稳定修复版)</title>
    <!-- 引入 Fabric.js 和 JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- 引入中文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; margin: 0; height: 100vh; overflow: hidden; background-color: #f4f6f8; }
        
        .layout { display: flex; height: 100%; }
        
        /* 左侧画布区 */
        .workspace { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #e0e0e0;
            background-image: radial-gradient(#aaa 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: auto;
            position: relative;
        }
        
        .canvas-box { 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
            background: white;
        }

        /* 右侧侧边栏 */
        .sidebar { width: 320px; background: white; border-left: 1px solid #ddd; display: flex; flex-direction: column; padding: 20px; z-index: 10; box-shadow: -2px 0 10px rgba(0,0,0,0.05); }
        
        h2 { margin: 0 0 20px 0; font-size: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; color: #333; }
        
        .panel { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed #eee; }
        .panel-label { font-size: 12px; color: #888; font-weight: bold; margin-bottom: 8px; display: block; }
        
        /* 按钮样式 */
        .btn { width: 100%; padding: 12px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; color: #333; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .btn:hover:not(:disabled) { background: #f8f9fa; border-color: #ccc; transform: translateY(-1px); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; background: #f5f5f5; }
        .btn-primary { background: #007bff; color: white; border-color: #007bff; font-weight: bold; }
        .btn-primary:hover:not(:disabled) { background: #0069d9; }

        /* 3:4 控件行 */
        .row { display: flex; gap: 8px; }
        select { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; outline: none; }
        
        /* 底部下载 */
        .footer { margin-top: auto; }
        #download-link { display: block; text-align: center; margin-top: 10px; font-size: 13px; color: #007bff; text-decoration: none; }
        #download-link:hover { text-decoration: underline; }

        /* 悬浮工具栏 */
        .floating-tools {
            position: absolute; display: none; background: white; 
            padding: 6px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); 
            z-index: 999; border: 1px solid #eee; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .tool-row { display: flex; align-items: center; gap: 6px; }
        .icon-btn { width: 32px; height: 32px; border: none; background: transparent; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #555; }
        .icon-btn:hover { background: #f0f0f0; }
        .icon-btn.active { background: #e3f2fd; color: #007bff; }
        .divider { width: 1px; height: 20px; background: #ddd; margin: 0 2px; }
        input[type="color"] { width: 24px; height: 24px; border: none; padding: 0; background: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="layout">
    <div class="workspace" id="workspace">
        <div class="canvas-box">
            <canvas id="c"></canvas>
        </div>
        <!-- 悬浮工具栏 -->
        <div id="float-bar" class="floating-tools">
            <div class="tool-row">
                <select id="tool-font" style="width: 100px; padding: 4px; font-size: 12px;">
                    <option value="'Noto Sans SC', sans-serif">思源黑体</option>
                    <option value="'Noto Serif SC', serif">思源宋体</option>
                    <option value="'ZCOOL KuaiLe', cursive">快乐体</option>
                    <option value="Arial, sans-serif">Arial</option>
                </select>
                <div class="divider"></div>
                <button class="icon-btn" id="tool-bold" title="加粗">B</button>
                <div class="divider"></div>
                <input type="color" id="tool-color" title="字体颜色">
                <div class="divider"></div>
                <button class="icon-btn" id="tool-del" title="删除" style="color:#d9534f">🗑️</button>
            </div>
        </div>
    </div>

    <aside class="sidebar">
        <h2>批量水印 Pro</h2>

        <div class="panel">
            <span class="panel-label">1. 上传图片</span>
            <input type="file" id="file-input" accept="image/*" multiple style="display:none">
            <button class="btn" onclick="document.getElementById('file-input').click()">
                📂 添加图片 / 批量
            </button>
        </div>

        <div class="panel">
            <span class="panel-label">2. 画布设置 (可选)</span>
            <div class="row">
                <select id="fill-mode" disabled>
                    <option value="smart">🎨 智能吸色</option>
                    <option value="#ffffff">⬜ 白色填充</option>
                    <option value="#000000">⬛ 黑色填充</option>
                </select>
                <button class="btn" id="btn-34" disabled style="margin-bottom:0">
                    📐 改为 3:4
                </button>
            </div>
            <p style="font-size:12px; color:#999; margin:6px 0 0 0">*自动填充背景，不裁剪原图
